name: airbus-ship-detection
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Core
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.16.3
  - matplotlib=3.10.7
  - seaborn=0.13.2
  # Imaging / CV
  - pillow=12.0.0
  - opencv=4.10.0
  - scikit-image=0.25.2
  # ML
  - scikit-learn=1.7.2
  - tensorflow=2.16.2
  - h5py=3.15.1
  # HF / datasets
  - tqdm=4.67.1
  - pyarrow=22.0.0
  # Notebooks
  - jupyterlab=4.5.0
  - ipykernel=7.1.0
  - ipywidgets=8.1.8
  - pip
  - pip:
    - segmentation-models==1.0.1
    - keras==3.13.0
    - datasets==4.4.1
    - huggingface-hub==1.1.5
